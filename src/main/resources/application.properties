quarkus.http.port=8082
quarkus.http.test-port=8092

# Upstream card database
quarkus.rest-client.mtgo-database.url=http://localhost:8080
quarkus.rest-client.mtgo-database.read-timeout=60000

# The draft client (vite on :5174) calls this service from the browser
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=/.*/
%test.quarkus.http.cors.enabled=true
%test.quarkus.http.cors.origins=/.*/

# Tables, seats and draft histories (docker compose up -d: postgres on :5434)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=mtgodraft
quarkus.datasource.password=mtgodraft
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/mtgodraft
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=none

# Tests run on an in-memory H2 with the same migrations
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:draft;MODE=PostgreSQL;DB_CLOSE_DELAY=-1

# Pick timer: Classic gives seconds-per-card for each card in the pack, at least classic-min-seconds
draft.timer.classic-seconds-per-card=5
draft.timer.classic-min-seconds=10
draft.timer.rochester-first-pick-seconds=40
draft.timer.rochester-pick-seconds=20
draft.timer.winston-move-seconds=30

# Live updates: a comment line keeps idle streams open and reveals dead connections
draft.stream.heartbeat-seconds=15
%test.draft.stream.heartbeat-seconds=1
